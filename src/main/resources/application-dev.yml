spring:
  datasource:
    url: jdbc:h2:mem:businesscarddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
server:
  port: 8080
jwt:
  secret: "change-this-secret-in-production"
  expiration: 3600000
cors:
  allowed-origins:
    - http://localhost:3000
